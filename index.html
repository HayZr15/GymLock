<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymLock</title>
    <link rel="manifest" href="manifest.json">
    <!-- Theme colors (light/dark) for browsers that support them -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ccff00">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#99cc00">
    <meta name="msapplication-TileColor" content="#ccff00"> <!-- Windows -->
    <meta name="apple-mobile-web-app-status-bar-style" content="#ccff00"> <!-- iOS Safari -->
    <link rel="apple-touch-icon" href="icon-192x192.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="app-header">
        <div class="container header-top">
            <h1 class="app-title">GymLock</h1>
            <button id="btn-lang-toggle" class="filter-btn lang-toggle-btn">EN</button>
        </div>
    </header>

    <main class="container">

        <section id="view-dashboard" class="app-view">
            <div id="workout-program-container"></div>

            <div class="dashboard-card chart-card">
                <h3 id="title-chart">Voortgang</h3>
                <p id="sub-chart" class="subtitle">Gewichtsverloop afgelopen periode</p>
                <div class="chart-wrapper">
                    <canvas id="progressChart"></canvas>
                </div>
            </div>
        </section>

        <section id="view-logs" class="app-view hidden">
            <div class="dashboard-card">
                <h3 id="title-add-log">Activiteit Loggen</h3>
                <p id="sub-add-log" class="subtitle">Voer je training of fysiometrie in</p>
                
                <form id="form-add-log" onsubmit="event.preventDefault(); addNewLog();">
                    <div class="form-group">
                        <label id="label-category" for="input-category">Categorie</label>
                        <select id="input-category">
                            <option value="Krachttraining">Krachttraining</option>
                            <option value="Cardio">Cardio</option>
                            <option value="Voeding">Voeding</option>
                            <option value="Stappen">Stappen</option>
                            <option value="Hartslag">Hartslag</option>
                            <option value="Gewicht">Gewicht (kg)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="label-amount" for="input-amount">Waarde / Aantal</label>
                        <input type="number" id="input-amount" required placeholder="Bijv. 80">
                    </div>
                    <div class="form-group">
                        <label id="label-date" for="input-date">Datum</label>
                        <input type="date" id="input-date" required>
                    </div>
                    <button type="submit" id="btn-submit-log" class="btn-primary">Log Opslaan</button>
                </form>
            </div>

            <div class="dashboard-card">
                <h3 id="title-history">Geschiedenis</h3>
                <p id="sub-history" class="subtitle">Je geregistreerde activiteiten</p>
                <div id="log-list"></div>
            </div>
        </section>

        <section id="view-settings" class="app-view hidden">
            <div class="settings-card profile-card">
                <h3 id="title-profile-card">Profiel</h3>
                <p id="sub-profile-card" class="subtitle">Je fysiologische eigenschappen voor het schema</p>
                
                <div class="form-group">
                    <label id="label-height" for="profile-height">Lengte (cm)</label>
                    <input type="number" id="profile-height" placeholder="Bijv. 180">
                </div>
                <div class="form-group">
                    <label id="label-weight" for="profile-weight">Gewicht (kg)</label>
                    <input type="number" id="profile-weight" placeholder="Bijv. 80">
                </div>
                <div class="form-group">
                    <label id="label-age" for="profile-age">Leeftijd</label>
                    <input type="number" id="profile-age" placeholder="Bijv. 24">
                </div>
                <div class="form-group">
                    <label id="label-frequency" for="profile-frequency">Trainingen per week</label>
                    <select id="profile-frequency">
                        <option value="1-2">1 - 2</option>
                        <option value="3-4">3 - 4</option>
                        <option value="5+">5+</option>
                    </select>
                </div>
                <button id="btn-save-profile" class="btn-primary" onclick="saveProfile()">Profiel Opslaan</button>
            </div>

            <div class="settings-card data-card">
                <h3 id="title-data-management">Data Beheer</h3>
                <p id="text-clear-data" class="clear-data-text">Wil je alle opgeslagen gegevens wissen?</p>
                <button id="btn-reset-data" class="btn-danger" onclick="resetAllData()">Reset Alle Gegevens</button>
            </div>
        </section>

    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchView('dashboard', this)">
            <span id="nav-dashboard">Dashboard</span>
        </button>
        <button class="nav-item" onclick="switchView('logs', this)">
            <span id="nav-logs">Logs</span>
        </button>
        <button class="nav-item" onclick="switchView('settings', this)">
            <span id="nav-settings">Instellingen</span>
        </button>
    </nav>

    <script src="script/app.js"></script>
</body>
</html>
